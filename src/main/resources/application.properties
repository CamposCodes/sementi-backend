spring.application.name=sementi-backend

# O Render injeta a porta em PORT. Sem isto a aplicacao sobe em 8080
# fixo e o health check do Render falha. O default cobre o local.
server.port=${PORT:8080}

# Conexao com o banco vem do ambiente, nunca do repositorio:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# O Spring liga essas variaveis em spring.datasource.* sozinho. Nao as
# declaramos aqui de proposito: declarar exigiria um placeholder que
# quebra o build local de quem nao tem as variaveis, e a mensagem de
# erro padrao do Spring ja e clara quando faltam.

# O Hikari e o dono do pool. Por isso a URL do Neon usa o endpoint
# DIRETO, nao o -pooler: empilhar o PgBouncer do Neon sobre o Hikari e
# exatamente o que a doc deles manda evitar.
spring.datasource.hikari.maximum-pool-size=5
# minimum-idle=0 deixa o pool encolher ate zero. Sem isso uma conexao
# ociosa segura o compute do Neon acordado, gastando hora de free tier
# a noite inteira sem ninguem usando.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# Abaixo do autosuspend do Neon, senao o pool entrega conexao morta na
# primeira requisicao depois da soneca.
spring.datasource.hikari.max-lifetime=240000

# Sem ferramenta de migration decidida ainda (issue #2). 'none' impede
# o Hibernate de criar schema por conta propria.
spring.jpa.hibernate.ddl-auto=none

# Mostra os componentes (db: UP) sem expor detalhes como versao do
# banco e query de validacao num endpoint publico.
management.endpoint.health.show-components=always
