# H2 em memoria apenas para o teste de contexto subir sem depender de
# banco externo. Nao existe repositorio nem query real ainda.
#
# Quando existir, trocar por Testcontainers com Postgres de verdade:
# H2 mente sobre comportamento do Postgres (tipo enum nativo, upsert,
# constraint parcial), e o schema do Sementi usa varias dessas coisas.
spring.datasource.url=jdbc:h2:mem:sementi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
