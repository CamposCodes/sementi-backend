plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'api.sementi'
version = '0.0.1-SNAPSHOT'
description = 'API do Sementi - app de vocabulario diario'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// H2 so para o teste de contexto subir sem banco externo. Ver
	// src/test/resources/application.properties.
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Nome fixo para o Dockerfile copiar sem glob. Sem isto o nome carrega
// a versao, e 'gradle build' ainda gera um segundo jar (-plain.jar) --
// dois arquivos casando com *.jar quebram o COPY da imagem.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
